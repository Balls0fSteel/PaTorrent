[package]
name = "lt-swarm"
description = "Scale, interop and swarm benchmarks for PaTorrent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `fuzzing` exposes the MSE/PE handshake machine, which the interop readiness probe speaks.
patorrent-core = { workspace = true, features = ["mock", "fuzzing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
