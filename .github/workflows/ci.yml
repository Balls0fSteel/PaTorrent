name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Note: never set RUSTFLAGS here; it would override the static-CRT flags in .cargo/config.toml.

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The engine links the system OpenSSL for HTTPS trackers (PLAN.md D9); patorrent-gtk
      # builds against the system GTK 4 (4.12 or later).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgtk-4-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # macOS (PLAN.md D23): the whole workspace on Apple silicon, with Secure Transport for TLS and
  # Homebrew's GTK 4 for patorrent-gtk. Intel Macs are built (and linked) only, without the GTK
  # GUI: Homebrew on this runner has arm64 libraries only.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install gtk4 pkgconf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # every test binary runs, so one failure (a flaky one: PLAN Known TODOs "macOS") does not
      # hide the results of the others
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --workspace --exclude patorrent-gtk --target x86_64-apple-darwin
      # a test binary that crashes prints nothing of its own: macOS's crash report says why
      - name: Crash reports
        if: failure()
        run: python3 .github/scripts/macos_crash_reports.py

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo check --workspace --all-targets

  # the release build, its slow tests and reports, and the installer that release.yml makes
  # (built, installed and uninstalled here too, so installer breakage shows before a tag)
  release-windows:
    needs: test
    runs-on: windows-latest
    env:
      # NSIS as release.yml pins it (see there); keep the two in step
      NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe
      NSIS_SHA256: DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Slow tests (release)
        run: cargo test --release -p patorrent-core -- --ignored
      - name: Size, dependency and scale report
        shell: pwsh
        run: |
          $lines = @('## Release build (x86_64-pc-windows-msvc, static CRT)', '', '| Binary | Size |', '|---|---:|')
          foreach ($f in Get-ChildItem target/release/*.exe) { $lines += ('| {0} | {1:N0} KB |' -f $f.Name, ($f.Length / 1KB)) }
          $lines += @('', '## Linked crates (normal dependencies)', '', '```text')
          $lines += (cargo tree -e normal --workspace --prefix none --target x86_64-pc-windows-msvc | ForEach-Object { $_ -replace ' \(\*\)$', '' } | Where-Object { $_ } | Sort-Object -Unique)
          $lines += @('```', '', '## Scale benchmark (simulated engine)', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe scale --torrents 10000 --seconds 3)
          $lines += @('```', '', '## Real engine: cold start with 1,000 saved torrents', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe load --count 1000)
          $lines += @('```', '', '## Real engine: 256 MiB loopback transfer', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe loopback --mb 256)
          $lines += @('```', '', '## Metadata parse benchmark (5,000 synthetic .torrent files)', '', '```text')
          & ./target/release/lt-swarm.exe gen --count 5000 --out corpus | Out-Null
          $lines += (& ./target/release/lt-swarm.exe parse corpus)
          $lines += '```'
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      # as release.yml names a build that is not a tag: <workspace version>-dev.<commit>
      - id: version
        name: Version
        shell: pwsh
        run: |
          $crate = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq patorrent).version
          if (-not $crate) { echo "::error::cargo metadata gave no version for patorrent"; exit 1 }
          "version=$crate-dev.$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
      # The installer steps below are release.yml's, with this job's version.
      - name: NSIS
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Join-Path $env:RUNNER_TEMP nsis-setup.exe
          curl.exe -fsSL --retry 5 --retry-all-errors -o $setup $env:NSIS_URL
          if ($LASTEXITCODE -ne 0) { echo "::error::could not download $env:NSIS_URL"; exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne $env:NSIS_SHA256) {
            echo "::error::$env:NSIS_URL has SHA-256 $hash, expected $env:NSIS_SHA256"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP nsis
          $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\makensis.exe")) {
            echo "::error::the NSIS installer failed (exit code $($p.ExitCode))"
            exit 1
          }
          & "$dir\makensis.exe" -VERSION
          "MAKENSIS=$dir\makensis.exe" >> $env:GITHUB_ENV
      - name: Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $family = (Get-Content assets/patina-icons/app-icon.txt -Raw).Trim()
          $icon = "assets\patina-icons\exports\app\$family.ico"
          if (-not $family -or -not (Test-Path $icon)) {
            echo "::error file=assets/patina-icons/app-icon.txt::names '$family', which has no $icon"
            exit 1
          }
          & $env:MAKENSIS /NOCD /WX "/DVERSION=$version" "/DBINDIR=target\release" "/DICON=$icon" `
            "/DOUTFILE=patorrent-$version-windows-x64-setup.exe" packaging\windows\patorrent.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "patorrent-$version-windows-x64-setup.exe" | Format-List Name, Length, VersionInfo
      - name: Install and uninstall
        shell: pwsh
        # a hung setup or patorrent.exe --associate must not hold the job for hours
        timeout-minutes: 10
        run: |
          function Fail($m) { echo "::error::$m"; exit 1 }
          $version = "${{ steps.version.outputs.version }}"
          $dir = Join-Path $env:RUNNER_TEMP "PaTorrent test"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PaTorrent'
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PaTorrent.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) PaTorrent.lnk
          $classes = 'HKCU:\Software\Classes'
          $p = Start-Process ".\patorrent-$version-windows-x64-setup.exe" -Wait -PassThru `
            -ArgumentList '/S', '/DESKTOPSHORTCUT', '/ASSOCIATE=torrent,magnet', "/D=$dir"
          if ($p.ExitCode -ne 0) { Fail "Setup exited with $($p.ExitCode)" }
          foreach ($f in 'patorrent.exe', 'patorrent-nox.exe', 'LICENSE.md', 'THIRD-PARTY-NOTICES.md', 'uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { Fail "$f was not installed" }
          }
          if (-not (Test-Path $menu)) { Fail "no Start menu shortcut" }
          if (-not (Test-Path $desktop)) { Fail "no desktop shortcut" }
          $u = Get-ItemProperty $key
          $u | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, InstallLocation, EstimatedSize, QuietUninstallString
          if ($u.DisplayVersion -ne $version -or $u.InstallLocation -ne $dir) { Fail "the Uninstall key is wrong" }
          if ((Get-Item "$classes\.torrent").GetValue('') -ne 'PaTorrent.torrent') { Fail ".torrent is not associated" }
          $open = (Get-Item "$classes\magnet\shell\open\command").GetValue('')
          # SEC-18: the shell passes links through --shell, so nothing after %1 becomes a switch
          if ($open -ne "`"$dir\patorrent.exe`" --shell `"%1`"") { Fail "magnet: opens '$open'" }
          & "$dir\patorrent-nox.exe" --version
          if ($LASTEXITCODE -ne 0) { Fail "the installed patorrent-nox.exe did not run" }

          $p = Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # it goes on from a copy of itself in %TEMP%: wait for that
          for ($i = 0; $i -lt 60 -and ((Test-Path $key) -or (Test-Path $dir)); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir; Fail "the folder is still there" }
          if (Test-Path $key) { Fail "the Uninstall key is still there" }
          if ((Test-Path $menu) -or (Test-Path $desktop)) { Fail "a shortcut is still there" }
          if ((Test-Path "$classes\PaTorrent.torrent") -or (Test-Path "$classes\PaTorrent.magnet") -or (Test-Path "$classes\magnet")) {
            Fail "an association is still there"
          }
          if ((Get-Item "$classes\.torrent" -ErrorAction SilentlyContinue)?.GetValue('')) { Fail ".torrent still names a program" }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue).PaTorrent) {
            Fail "PaTorrent is still in RegisteredApplications"
          }
          echo "installed, associated, uninstalled: nothing left"
      - uses: actions/upload-artifact@v7
        with:
          name: patorrent-windows-x64
          path: |
            target/release/patorrent.exe
            target/release/patorrent-nox.exe
            LICENSE.md
            THIRD-PARTY-NOTICES.md
            patorrent-*-setup.exe
          retention-days: 14
