# Coverage-guided fuzz targets (cargo-fuzz, nightly only). Run from the repository root:
#   cargo +nightly fuzz run <target>
# Its own workspace, so stable builds of the main workspace never see it.
[package]
name = "patorrent-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
authors = ["DukeCorp1996"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
patorrent-core = { path = "../crates/core", features = ["fuzzing"] }
patorrent-nox = { path = "../crates/nox" }
patorrent-frontend = { path = "../crates/frontend" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "bdecode"
path = "fuzz_targets/bdecode.rs"
test = false
doc = false
bench = false

