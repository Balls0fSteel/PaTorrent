[package]
name = "patorrent-nox"
description = "Headless PaTorrent daemon (in Phase 0: a command-line driver for the engine API)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
patorrent-core = { workspace = true, features = ["mock"] }
patorrent-frontend.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

# the service tests split command lines with Windows's own parser
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell"] }

[lints]
workspace = true
