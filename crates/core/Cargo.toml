[package]
name = "patorrent-core"
description = "PaTorrent's BitTorrent engine: a Rust port of libtorrent-rasterbar 2.0.11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Simulated engine behind the real API, for frontend development and scale tests.
mock = []
# Exposes the internal wire, tracker and HTTP parsers to the cargo-fuzz targets in `fuzz/` (and
# the MSE/PE handshake to `lt-swarm interop`).
fuzzing = []

[dependencies]
mio.workspace = true

# `SourceFd`: the network-change notifier's netlink / PF_ROUTE socket on the reactor
[target.'cfg(unix)'.dependencies]
mio = { workspace = true, features = ["os-ext"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }

[lints]
workspace = true
