name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Note: never set RUSTFLAGS here; it would override the static-CRT flags in .cargo/config.toml.

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The engine links the system OpenSSL for HTTPS trackers (PLAN.md D9); patorrent-gtk
      # builds against the system GTK 4 (4.12 or later).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgtk-4-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # macOS (PLAN.md D23): the engine, nox and the tools, with Secure Transport for TLS, on Apple
  # silicon; Intel Macs are built (and linked) only. The GTK GUI's macOS pieces are still to
  # come (Road to 1.0 item 8), so it is left out here.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude patorrent-gtk --all-targets -- -D warnings
      - run: cargo test --workspace --exclude patorrent-gtk
      - run: cargo build --workspace --exclude patorrent-gtk --target x86_64-apple-darwin
      # a test binary that crashes prints nothing of its own: macOS's crash report says why
      - name: Crash reports
        if: failure()
        run: python3 .github/scripts/macos_crash_reports.py

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo check --workspace --all-targets

  release-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Slow tests (release)
        run: cargo test --release -p patorrent-core -- --ignored
      - name: Size, dependency and scale report
        shell: pwsh
        run: |
          $lines = @('## Release build (x86_64-pc-windows-msvc, static CRT)', '', '| Binary | Size |', '|---|---:|')
          foreach ($f in Get-ChildItem target/release/*.exe) { $lines += ('| {0} | {1:N0} KB |' -f $f.Name, ($f.Length / 1KB)) }
          $lines += @('', '## Linked crates (normal dependencies)', '', '```text')
          $lines += (cargo tree -e normal --workspace --prefix none --target x86_64-pc-windows-msvc | ForEach-Object { $_ -replace ' \(\*\)$', '' } | Where-Object { $_ } | Sort-Object -Unique)
          $lines += @('```', '', '## Scale benchmark (simulated engine)', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe scale --torrents 10000 --seconds 3)
          $lines += @('```', '', '## Real engine: cold start with 1,000 saved torrents', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe load --count 1000)
          $lines += @('```', '', '## Real engine: 256 MiB loopback transfer', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe loopback --mb 256)
          $lines += @('```', '', '## Metadata parse benchmark (5,000 synthetic .torrent files)', '', '```text')
          & ./target/release/lt-swarm.exe gen --count 5000 --out corpus | Out-Null
          $lines += (& ./target/release/lt-swarm.exe parse corpus)
          $lines += '```'
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: patorrent-windows-x64
          path: |
            target/release/patorrent.exe
            target/release/patorrent-nox.exe
            LICENSE.md
            THIRD-PARTY-NOTICES.md
          retention-days: 14
