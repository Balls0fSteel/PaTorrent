name: macOS gate 8

# Profiles and portable mode on a Mac (D42, docs/PROFILES_PLAN.md gate 8), run by hand: a
# portable PaTorrent.app beside patorrent.ini, a named profile in it, per-profile LaunchAgents
# started by launchd, and a quarantined copy for App Translocation's notice. Screenshots and a
# report are uploaded; a check that fails fails its step.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate8:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
      OUT: ${{ github.workspace }}/gate8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install gtk4 adwaita-icon-theme librsvg pkgconf
      - run: cargo build --release --locked -p patorrent-gtk
      - name: PaTorrent.app
        run: |
          family=$(tr -d '[:space:]' < assets/patina-icons/app-icon.txt)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          python3 .github/scripts/macos_bundle.py app \
            --binary target/release/patorrent-gtk \
            --prefix "$(brew --prefix)" \
            --icon-dir "assets/patina-icons/exports/app/$family" \
            --app-id io.github.balls0fsteel.PaTorrent \
            --version "$version" \
            --minos-file macos-minos.txt \
            --out PaTorrent.app
          xattr -cr PaTorrent.app
          codesign --force --deep --sign - PaTorrent.app
          mkdir -p "$OUT"

      # A folder with PaTorrent.app and patorrent.ini, as on a USB stick: the default profile
      # and `work` run side by side, each keeping everything in the folder and nothing in
      # ~/Library
      - name: Portable
        run: |
          export HOME="$RUNNER_TEMP/home-portable"
          mkdir -p "$HOME"
          stick="$RUNNER_TEMP/stick"
          mkdir -p "$stick/profiles/work"
          ditto PaTorrent.app "$stick/PaTorrent.app"
          : > "$stick/patorrent.ini"
          "$stick/PaTorrent.app/Contents/MacOS/PaTorrent" > "$OUT/portable-default.log" 2>&1 &
          "$stick/PaTorrent.app/Contents/MacOS/PaTorrent" --profile work > "$OUT/portable-work.log" 2>&1 &
          sleep 25
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$OUT/portable.png" || echo "::warning::screencapture failed"
          ps -axo pid,command | grep '[p]atorrent-gtk' | tee "$OUT/portable-ps.txt"
          find "$stick" -maxdepth 3 -not -path '*/PaTorrent.app/*' | sort | tee "$OUT/portable-files.txt"
          ls -la "$HOME/Library/Application Support" 2>&1 | tee -a "$OUT/portable-files.txt"
          pkill -f patorrent-gtk || true
          sleep 3
          ok=1
          for f in patorrent.lock metadata.pack profiles/work/patorrent.lock profiles/work/metadata.pack; do
            [ -e "$stick/$f" ] || { echo "::error::$f is not in the portable folder"; ok=0; }
          done
          [ ! -e "$HOME/Library/Application Support/PaTorrent" ] || { echo "::error::wrote to ~/Library/Application Support/PaTorrent"; ok=0; }
          [ "$(wc -l < "$OUT/portable-ps.txt")" -ge 2 ] || { echo "::error::two windows (default and work) were not both running"; ok=0; }
          [ "$ok" = 1 ]

      # What Preferences > "Start PaTorrent at login" writes, once per profile
      # (crates/gtk/src/macos.rs launch_agent): launchd starts both, each in its profile
      - name: LaunchAgents per profile
        if: always()
        run: |
          app="$GITHUB_WORKSPACE/PaTorrent.app/Contents/MacOS/PaTorrent"
          agents="$RUNNER_TEMP/agents"
          mkdir -p "$agents"
          # autostart is set from a profile that exists (else its "Create it?" question waits)
          mkdir -p "$HOME/Library/Application Support/PaTorrent/profiles/work/gtk"
          for p in default work; do
            label=io.github.balls0fsteel.PaTorrent
            args="<string>$app</string>"
            if [ "$p" != default ]; then
              label="$label.$p"
              args="$args<string>--profile</string><string>$p</string>"
            fi
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              "<key>Label</key><string>$label</string>" \
              "<key>ProgramArguments</key><array>$args</array>" \
              '<key>RunAtLoad</key><true/>' \
              '<key>LimitLoadToSessionType</key><string>Aqua</string>' \
              '<key>ProcessType</key><string>Interactive</string>' \
              '</dict></plist>' > "$agents/$label.plist"
            plutil -lint "$agents/$label.plist"
            launchctl bootstrap "gui/$(id -u)" "$agents/$label.plist"
          done
          sleep 25
          perl -e 'alarm 20; exec @ARGV' screencapture -x "$OUT/launchagents.png" || echo "::warning::screencapture failed"
          launchctl list | grep -i patorrent | tee "$OUT/launchagents.txt"
          ps -axo pid,command | grep '[p]atorrent-gtk' | tee -a "$OUT/launchagents.txt"
          for f in "$agents"/*.plist; do launchctl bootout "gui/$(id -u)" "$f" || true; done
          pkill -f patorrent-gtk || true
          find "$HOME/Library/Application Support/PaTorrent" | sort | tee -a "$OUT/launchagents.txt"
          grep -q -- '--profile work' "$OUT/launchagents.txt"
          [ "$(grep -c '[p]atorrent-gtk' "$OUT/launchagents.txt")" -ge 2 ]
          # each started its own library
          grep -q 'PaTorrent/gtk/patorrent.lock$' "$OUT/launchagents.txt"
          grep -q 'PaTorrent/profiles/work/gtk/patorrent.lock$' "$OUT/launchagents.txt"

      # (before the step below, which may hang on Gatekeeper)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-gate8-portable
          path: gate8
          overwrite: true

      # A quarantined download opened where it was unpacked: Gatekeeper translocates it to a
      # random read-only folder, where patorrent.ini beside it is not seen; the app says so.
      # (The first run hung here for 45 minutes: every call has a time limit now.) Plain, an
      # unsigned app is refused ("Not Opened"); then as a user's "Open Anyway" would allow it:
      # the quarantine's user-approved flag (0x40), and Gatekeeper's own exception list.
      - name: Translocated
        if: always()
        timeout-minutes: 6
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          try() {
            name=$1 flags=$2
            dl="$RUNNER_TEMP/Downloads/$name/PaTorrent"
            mkdir -p "$dl"
            ditto PaTorrent.app "$dl/PaTorrent.app"
            : > "$dl/patorrent.ini"
            xattr -w com.apple.quarantine "$flags;$(printf '%x' "$(date +%s)");Safari;" "$dl/PaTorrent.app"
            if [ "$name" = spctl-add ]; then
              t 30 sudo spctl --add --label PaTorrentGate8 "$dl/PaTorrent.app" 2>&1 || echo "(spctl --add: $?)"
            fi
            echo "== $name"
            t 30 spctl --assess --verbose=4 --type execute "$dl/PaTorrent.app" 2>&1 || echo "(spctl: $?)"
            t 30 open "$dl/PaTorrent.app" 2>&1 || echo "(open: $?)"
            sleep 25
            t 20 screencapture -x "$OUT/translocated-$name.png" || echo "::warning::screencapture failed"
            ps -axo pid,command | grep -i -E '[p]atorrent|[A]ppTranslocation' | tee "$OUT/translocated-$name.txt"
            ls -la "$dl" | tee -a "$OUT/translocated-$name.txt"
            pkill -f patorrent-gtk || true
            pkill -f PaTorrent.app || true
            pkill -x CoreServicesUIAgent || true
            sleep 2
          }
          try plain 0083
          try approved 00c3
          try spctl-add 0083
          if grep -l 'AppTranslocation.*patorrent-gtk' "$OUT"/translocated-*.txt; then
            echo "the GUI ran translocated: see its screenshot for the notice"
          else
            echo "::warning::the GUI never ran translocated here"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-gate8-all
          path: gate8
          overwrite: true
