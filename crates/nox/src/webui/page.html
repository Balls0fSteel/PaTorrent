<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaTorrent</title>
<style>
:root { --bg: #f6f7f5; --fg: #1d2421; --muted: #5f6b66; --line: #d5dbd8; --accent: #2f7d6d; --bar: #e3e8e5; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161b19; --fg: #e3e8e5; --muted: #9aa5a0; --line: #2c3532; --accent: #4fb39d; --bar: #26302c; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 auto 0 0; }
main { padding: 12px 16px; }
input, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
#login { max-width: 320px; margin: 15vh auto; display: grid; gap: 8px; }
#login p { color: #c0392b; min-height: 1.4em; margin: 0; }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.name { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
.bar { width: 90px; height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--accent); }
#status { color: var(--muted); }
#add { display: flex; gap: 6px; flex: 1 1 320px; }
#add input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>PaTorrent</h1>
  <input name="username" placeholder="User name" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button>Log in</button>
  <p id="login-error"></p>
</form>
<div id="app" hidden>
  <header>
    <h1>PaTorrent</h1>
    <form id="add"><input name="urls" placeholder="Magnet link or http:// URL"><button>Add</button></form>
    <span id="status"></span>
    <button id="logout" type="button">Log out</button>
  </header>
  <main class="wrap">
    <table>
      <thead><tr><th>Name</th><th>Size</th><th>Done</th><th>Status</th><th>Down</th><th>Up</th><th>Seeds</th><th>Peers</th><th>ETA</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
