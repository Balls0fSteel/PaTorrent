name: CI

# The macos-debug branch: only a macOS diagnostics job (PLAN.md Next steps 0). Run with
# `gh workflow run CI --ref macos-debug`; never merged as is.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install gtk4 pkgconf
      # the GTK GUI on its own: built, linked and tested
      - name: GTK GUI
        id: gtk
        continue-on-error: true
        run: |
          cargo build -p patorrent-gtk
          ls -l target/debug/patorrent-gtk
          otool -L target/debug/patorrent-gtk | head -30
          cargo test -p patorrent-gtk
      # a_tracker_reply_sets_the_external_address fails now and then right after the core
      # crate's own tests: the same order, 8 times
      - name: The external-address tests after the core tests, 8 times
        if: always()
        run: |
          cargo test -p patorrent-core --lib --tests --no-run -q
          fails=0
          for i in $(seq 8); do
            echo "== round $i"
            cargo test -q -p patorrent-core --lib > /dev/null 2>&1 || echo "core tests failed in round $i"
            cargo test -q -p patorrent-core --test external_ip || fails=$((fails + 1))
          done
          echo "external-address failures: $fails of 8"
          test $fails -eq 0
      - name: GTK result
        if: always()
        run: 'echo "GTK step - ${{ steps.gtk.outcome }}"'
      - name: Crash reports
        if: failure() || steps.gtk.outcome == 'failure'
        run: python3 .github/scripts/macos_crash_reports.py
