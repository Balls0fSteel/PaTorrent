name: Fuzz

# Coverage-guided fuzzing of the parsers that read untrusted input (PLAN.md Q9).
# Each target runs for a fixed time on Linux, where libFuzzer and ASan need no setup.
on:
  push:
    branches: [main]
    paths: ["crates/core/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC: a longer run
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [bdecode, torrent_info, magnet, peer_wire, tracker_response, http_response, ut_metadata, ut_pex, dht_message, lsd, upnp, natpmp, pe_handshake, utp, ip_filter, web_seed]
    runs-on: ubuntu-24.04
    env:
      # taiki-e/install-action ships a musl-built cargo-fuzz, which defaults to
      # building for musl; ASan needs glibc, so name the target explicitly.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '1800') || '120' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The engine links the system OpenSSL for HTTPS trackers (PLAN.md D9).
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed metadata targets with the test torrents
        if: matrix.target == 'torrent_info' || matrix.target == 'bdecode'
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp crates/core/tests/fixtures/torrents/*.torrent fuzz/corpus/${{ matrix.target }}/
      - run: cargo fuzz run --target $FUZZ_TARGET_TRIPLE ${{ matrix.target }} -- -max_total_time=${{ env.SECONDS_PER_TARGET }}
      - name: Minimize corpus
        if: success()
        run: cargo fuzz cmin --target $FUZZ_TARGET_TRIPLE ${{ matrix.target }}
      - name: Save corpus
        if: success()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
