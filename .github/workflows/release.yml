name: Release

# The release files (PLAN.md Road to 1.0 items 6 and 7, D22; V2.0 goal 2): a tag `v<version>`
# builds them and attaches them to a draft GitHub release, which the owner checks and publishes
# (docs/RELEASING.md). A version with a suffix (1.0.0-rc.1) is marked as a pre-release, and
# docs/releases/<version>.md, when it exists, is the release's text. Started by hand, it builds
# the same files as an artifact and makes no release.
#
# - Windows x64: a zip of patorrent.exe and patorrent-nox.exe (static CRT, D7) with LICENSE.md
#   and THIRD-PARTY-NOTICES.md, and an installer of the same files (NSIS, packaging/windows),
#   which the job installs and uninstalls on the runner.
# - Linux x86_64 and aarch64: a tarball of patorrent-nox, patorrent-gtk, the desktop entry, the
#   systemd units and the same two texts. They link the system's glibc, OpenSSL 3 and GTK 4 as
#   Ubuntu 24.04 has them.
# - Linux x86_64 and aarch64 AppImages: PaTorrent (the GTK GUI with GTK 4 and its libraries)
#   and patorrent-nox (with OpenSSL), made by linuxdeploy; they need glibc 2.39 (Ubuntu 24.04)
#   or newer.
# - Linux x86_64 and aarch64 Flatpaks: a single-file bundle of the GTK GUI on the GNOME
#   runtime, built by flatpak-builder from packaging/flatpak (the manifest Flathub would build)
#   natively on each runner; installing it needs Flathub for the runtime.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Note: never set RUSTFLAGS here; it would override the static-CRT flags in .cargo/config.toml.

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: The version, and a tag that matches the crates
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate"
              exit 1
            fi
          else
            version="$crate-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      # NSIS for the installer, pinned by version and checksum: windows-latest (Windows Server
      # 2025) has none (actions/runner-images, images/windows/Windows2025-VS2026-Readme.md; only
      # the 2022 image lists NSIS). The SHA-256 is the one winget-pkgs publishes for this file
      # (manifests/n/NSIS/NSIS/3.13/NSIS.NSIS.installer.yaml).
      NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe
      NSIS_SHA256: DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p patorrent -p patorrent-nox
      - name: Zip
        shell: pwsh
        run: |
          $name = "patorrent-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/patorrent.exe, target/release/patorrent-nox.exe, LICENSE.md, THIRD-PARTY-NOTICES.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      # SourceForge redirects to a mirror (hence the retries); NSIS's own installer, silent, into
      # a folder of the job's
      - name: NSIS
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Join-Path $env:RUNNER_TEMP nsis-setup.exe
          curl.exe -fsSL --retry 5 --retry-all-errors -o $setup $env:NSIS_URL
          if ($LASTEXITCODE -ne 0) { echo "::error::could not download $env:NSIS_URL"; exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne $env:NSIS_SHA256) {
            echo "::error::$env:NSIS_URL has SHA-256 $hash, expected $env:NSIS_SHA256"
            exit 1
          }
          $dir = Join-Path $env:RUNNER_TEMP nsis
          $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\makensis.exe")) {
            echo "::error::the NSIS installer failed (exit code $($p.ExitCode))"
            exit 1
          }
          & "$dir\makensis.exe" -VERSION
          "MAKENSIS=$dir\makensis.exe" >> $env:GITHUB_ENV
      # the same executables and texts as the zip, with the app icon assets/patina-icons/
      # app-icon.txt names (as the other builds); /WX: any makensis warning (a language missing
      # one of strings.nsh's texts, say) fails the build
      - name: Installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $family = (Get-Content assets/patina-icons/app-icon.txt -Raw).Trim()
          $icon = "assets\patina-icons\exports\app\$family.ico"
          if (-not $family -or -not (Test-Path $icon)) {
            echo "::error file=assets/patina-icons/app-icon.txt::names '$family', which has no $icon"
            exit 1
          }
          & $env:MAKENSIS /NOCD /WX "/DVERSION=$version" "/DBINDIR=target\release" "/DICON=$icon" `
            "/DOUTFILE=patorrent-$version-windows-x64-setup.exe" packaging\windows\patorrent.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "patorrent-$version-windows-x64-setup.exe" | Format-List Name, Length, VersionInfo
      # The installer on the runner, as a user would run it silently: for this user into a
      # temporary folder, with the desktop shortcut and both associations (a throwaway machine;
      # a test on a developer's PC leaves the associations alone), then the silent uninstall
      # Settings > Apps runs, which must take everything with it: the files and the folder, the
      # shortcuts, its Uninstall key and, through patorrent.exe --unregister, the associations.
      - name: Install and uninstall
        shell: pwsh
        # a hung setup or patorrent.exe --associate must not hold the job for hours
        timeout-minutes: 10
        run: |
          function Fail($m) { echo "::error::$m"; exit 1 }
          $version = "${{ needs.version.outputs.version }}"
          $dir = Join-Path $env:RUNNER_TEMP "PaTorrent test"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PaTorrent'
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\PaTorrent.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) PaTorrent.lnk
          $classes = 'HKCU:\Software\Classes'
          $p = Start-Process ".\patorrent-$version-windows-x64-setup.exe" -Wait -PassThru `
            -ArgumentList '/S', '/DESKTOPSHORTCUT', '/ASSOCIATE=torrent,magnet', "/D=$dir"
          if ($p.ExitCode -ne 0) { Fail "Setup exited with $($p.ExitCode)" }
          foreach ($f in 'patorrent.exe', 'patorrent-nox.exe', 'LICENSE.md', 'THIRD-PARTY-NOTICES.md', 'uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { Fail "$f was not installed" }
          }
          if (-not (Test-Path $menu)) { Fail "no Start menu shortcut" }
          if (-not (Test-Path $desktop)) { Fail "no desktop shortcut" }
          $u = Get-ItemProperty $key
          $u | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, InstallLocation, EstimatedSize, QuietUninstallString
          if ($u.DisplayVersion -ne $version -or $u.InstallLocation -ne $dir) { Fail "the Uninstall key is wrong" }
          if ((Get-Item "$classes\.torrent").GetValue('') -ne 'PaTorrent.torrent') { Fail ".torrent is not associated" }
          $open = (Get-Item "$classes\magnet\shell\open\command").GetValue('')
          if ($open -ne "`"$dir\patorrent.exe`" `"%1`"") { Fail "magnet: opens '$open'" }
          & "$dir\patorrent-nox.exe" --version
          if ($LASTEXITCODE -ne 0) { Fail "the installed patorrent-nox.exe did not run" }

          $p = Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          # it goes on from a copy of itself in %TEMP%: wait for that
          for ($i = 0; $i -lt 60 -and ((Test-Path $key) -or (Test-Path $dir)); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir; Fail "the folder is still there" }
          if (Test-Path $key) { Fail "the Uninstall key is still there" }
          if ((Test-Path $menu) -or (Test-Path $desktop)) { Fail "a shortcut is still there" }
          if ((Test-Path "$classes\PaTorrent.torrent") -or (Test-Path "$classes\PaTorrent.magnet") -or (Test-Path "$classes\magnet")) {
            Fail "an association is still there"
          }
          if ((Get-Item "$classes\.torrent" -ErrorAction SilentlyContinue)?.GetValue('')) { Fail ".torrent still names a program" }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue).PaTorrent) {
            Fail "PaTorrent is still in RegisteredApplications"
          }
          echo "installed, associated, uninstalled: nothing left"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            patorrent-*.zip
            patorrent-*-setup.exe

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # pinned linuxdeploy releases and the GTK plugin's commit (no `continuous` builds)
      LINUXDEPLOY: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1
      LINUXDEPLOY_APPIMAGE: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1
      LINUXDEPLOY_GTK: https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
      # the runners have no FUSE: AppImages (linuxdeploy's own) unpack themselves to run
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      # the provisional app icon's family: assets/patina-icons/app-icon.txt names it for every
      # build (Road to 1.0 item 10; assets/patina-icons/INTEGRATION.md)
      - name: The app icon (app-icon.txt)
        run: |
          family=$(tr -d '[:space:]' < assets/patina-icons/app-icon.txt)
          dir="assets/patina-icons/exports/app/$family"
          if [ -z "$family" ] || [ ! -f "$dir/256.png" ]; then
            echo "::error file=assets/patina-icons/app-icon.txt::names '$family', which has no $dir/256.png"
            exit 1
          fi
          echo "APP_ICON_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libgtk-4-dev libgdk-pixbuf2.0-bin librsvg2-common
      - run: cargo build --release --locked -p patorrent-nox -p patorrent-gtk
      - name: Tarball
        run: |
          name="patorrent-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "$name/systemd"
          install -m 755 target/release/patorrent-nox target/release/patorrent-gtk "$name/"
          install -m 644 LICENSE.md THIRD-PARTY-NOTICES.md contrib/linux/*.desktop "$name/"
          cp -r contrib/systemd/system contrib/systemd/user "$name/systemd/"
          tar -czf "$name.tar.gz" --owner=0 --group=0 "$name"
      - name: AppImages
        run: |
          version="${{ needs.version.outputs.version }}"
          arch="${{ matrix.arch }}"
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy" "$LINUXDEPLOY/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-appimage" "$LINUXDEPLOY_APPIMAGE/linuxdeploy-plugin-appimage-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk.sh" "$LINUXDEPLOY_GTK"
          chmod +x "$tools"/*
          export PATH="$tools:$PATH" LINUXDEPLOY_OUTPUT_VERSION="$version"
          app_id=io.github.balls0fsteel.PaTorrent
          icons="$RUNNER_TEMP/icons"
          mkdir -p "$icons"
          cp "$APP_ICON_DIR/256.png" "$icons/$app_id.png"
          cp "$APP_ICON_DIR/256.png" "$icons/$app_id.Nox.png"

          # the GTK GUI, GTK 4 bundled (the plugin sets GTK's module, schema and loader paths)
          DEPLOY_GTK_VERSION=4 LDAI_OUTPUT="PaTorrent-$version-$arch.AppImage" linuxdeploy \
            --appdir AppDir-gtk \
            --executable target/release/patorrent-gtk \
            --desktop-file "contrib/linux/$app_id.desktop" \
            --icon-file "$icons/$app_id.png" \
            --plugin gtk --output appimage

          # nox: a terminal program, kept out of the menus; OpenSSL bundled
          cat > "$RUNNER_TEMP/$app_id.Nox.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=PaTorrent nox
          Comment=Headless BitTorrent daemon with a Web UI
          Exec=patorrent-nox
          Icon=$app_id.Nox
          Terminal=true
          NoDisplay=true
          Categories=Network;FileTransfer;P2P;
          EOF
          LDAI_OUTPUT="patorrent-nox-$version-$arch.AppImage" linuxdeploy \
            --appdir AppDir-nox \
            --executable target/release/patorrent-nox \
            --desktop-file "$RUNNER_TEMP/$app_id.Nox.desktop" \
            --icon-file "$icons/$app_id.Nox.png" \
            --output appimage

          # the libraries are inside (the runner has them too, so ldd alone proves nothing),
          # and the nox bundle starts
          ls AppDir-gtk/usr/lib/libgtk-4.so.* AppDir-nox/usr/lib/libssl.so.* AppDir-nox/usr/lib/libcrypto.so.*
          ./"patorrent-nox-$version-$arch.AppImage" --version
          ls -l *.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            patorrent-*.tar.gz
            *.AppImage

  flatpak:
    needs: version
    # natively on each architecture, as the linux job: the builder image is published for
    # linux/amd64 and linux/arm64, and Flathub has the GNOME runtime and the rust-stable
    # extension for aarch64 (docs/RELEASING.md, Flatpak)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # flatpak-builder with the GNOME runtime and Flathub's linter; it needs a privileged
    # container for bubblewrap
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      APP_ID: io.github.balls0fsteel.PaTorrent
      # flatpak-builder-tools' cargo generator, pinned by commit and checksum
      CARGO_GENERATOR: https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/880230d0c74bf532f29dff76521a650c0444bb14/cargo/flatpak-cargo-generator.py
      CARGO_GENERATOR_SHA256: 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380
    steps:
      - uses: actions/checkout@v7
      # AppStream sorts 1.0.0-rc.1 after 1.0.0, so the metainfo writes a pre-release with a
      # tilde (1.0.0~rc.1), which sorts before it
      - name: The metainfo's release is the workspace version
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2 | sed 's/-/~/')
          meta=$(grep -m1 '<release ' "packaging/flatpak/$APP_ID.metainfo.xml" | sed 's/.*version="\([^"]*\)".*/\1/')
          if [ "$meta" != "$crate" ]; then
            echo "::error::the metainfo's first <release> is $meta, Cargo.toml has $crate"
            exit 1
          fi
      - name: Validate the metainfo
        run: appstreamcli validate --no-net --explain "packaging/flatpak/$APP_ID.metainfo.xml"
      # a manifest cannot read a file, so it names the icon folder itself (ICON_DIR); it must be
      # the family assets/patina-icons/app-icon.txt names, as in the other builds
      - name: The manifest's icon is app-icon.txt's
        run: |
          family=$(tr -d '[:space:]' < assets/patina-icons/app-icon.txt)
          want="assets/patina-icons/exports/app/$family"
          have=$(sed -n 's/^ *ICON_DIR: *//p' "packaging/flatpak/$APP_ID.yml" | tr -d "\"'[:space:]")
          if [ "$have" != "$want" ]; then
            echo "::error file=packaging/flatpak/$APP_ID.yml::ICON_DIR is '$have', but assets/patina-icons/app-icon.txt names $family: set ICON_DIR to $want"
            exit 1
          fi
      - name: The crates, from Cargo.lock
        # advisory: a generator that cannot run leaves the committed file in place
        continue-on-error: true
        run: |
          # build with sources that match Cargo.lock even when the committed file is stale
          # (Flathub builds the committed one, so a warning asks for it to be regenerated)
          gen="$RUNNER_TEMP/cargo-generator"
          mkdir -p "$gen"
          curl -fsSL -o "$gen/flatpak-cargo-generator.py" "$CARGO_GENERATOR"
          echo "$CARGO_GENERATOR_SHA256  $gen/flatpak-cargo-generator.py" | sha256sum -c -
          # The image sets PYTHONPATH=/app/lib/python3.13/site-packages, which has aiohttp: a
          # pip run with it set finds aiohttp "already satisfied" there and installs nothing
          # into the venv, and the generator under -I (which ignores PYTHONPATH) then has no
          # aiohttp (Release 39791608589). So pip runs under -I too: same sys.path as the
          # generator, everything lands in the venv.
          py="$gen/venv/bin/python"
          if python3 -m venv "$gen/venv" \
            && "$py" -I -m pip install -q --no-cache-dir "aiohttp>=3.9.5,<4" "PyYAML>=6.0.2,<7" "tomlkit>=0.13.3,<1" \
            && "$py" -I "$gen/flatpak-cargo-generator.py" Cargo.lock -o "$gen/cargo-sources.json"; then
            if cmp -s "$gen/cargo-sources.json" packaging/flatpak/cargo-sources.json; then
              echo "packaging/flatpak/cargo-sources.json matches Cargo.lock"
            else
              echo "::warning file=packaging/flatpak/cargo-sources.json::stale against Cargo.lock; regenerate it (docs/RELEASING.md, Flatpak)"
              diff -u packaging/flatpak/cargo-sources.json "$gen/cargo-sources.json" | head -40 || true
              cp "$gen/cargo-sources.json" packaging/flatpak/cargo-sources.json
            fi
          else
            echo "::warning::could not run the cargo generator; building with the committed cargo-sources.json"
          fi
      # advisory; the exceptions a Flathub submission asks for (docs/RELEASING.md) are skipped,
      # so what it prints is what Flathub would still refuse
      - name: Flathub's linter on the manifest (advisory)
        continue-on-error: true
        run: flatpak-builder-lint --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json manifest "packaging/flatpak/$APP_ID.yml"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          bundle: PaTorrent-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
      - name: The bundle
        run: |
          ls -l "PaTorrent-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: PaTorrent-*.flatpak

  # macOS (PLAN.md D23, Road to 1.0 item 8): PaTorrent.app (the GTK GUI with GTK 4 and its
  # libraries from Homebrew, ad-hoc signed) in a .dmg, and patorrent-nox tarballs. The GitHub
  # runner is the only Mac the project has, so every step says what it found.
  # - arm64 (Apple silicon): the .app and nox, both run here with Homebrew moved away.
  # - x86_64 (Intel): nox only, cross-built; the runner's Homebrew is arm64 only, so there is no
  #   Intel GTK to bundle.
  macos:
    needs: version
    runs-on: macos-15
    env:
      # room in the GUI's load commands for the bundle's @executable_path/../Frameworks names,
      # which can be longer than Homebrew's (only the Apple targets; Windows keeps
      # .cargo/config.toml's static CRT)
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
      # no ._ AppleDouble files in the tarballs
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@v7
      # the provisional app icon's family: assets/patina-icons/app-icon.txt names it for every
      # build (Road to 1.0 item 10; assets/patina-icons/INTEGRATION.md); the folder has 16.png
      # ... 512.png
      - name: The app icon (app-icon.txt)
        run: |
          family=$(tr -d '[:space:]' < assets/patina-icons/app-icon.txt)
          dir="assets/patina-icons/exports/app/$family"
          if [ -z "$family" ] || [ ! -f "$dir/256.png" ]; then
            echo "::error file=assets/patina-icons/app-icon.txt::names '$family', which has no $dir/256.png"
            exit 1
          fi
          echo "APP_ICON_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      # gtk4 as in ci.yml; Adwaita for the toolbar's icons, librsvg for its SVGs
      - run: brew install gtk4 adwaita-icon-theme librsvg pkgconf
      - name: Build
        run: |
          cargo build --release --locked -p patorrent-gtk -p patorrent-nox
          cargo build --release --locked -p patorrent-nox --target x86_64-apple-darwin
          for f in target/release/patorrent-gtk target/release/patorrent-nox target/x86_64-apple-darwin/release/patorrent-nox; do echo "$f: $(lipo -archs "$f")"; done
          otool -L target/release/patorrent-gtk target/release/patorrent-nox target/x86_64-apple-darwin/release/patorrent-nox
      - name: PaTorrent.app
        run: |
          # what Homebrew's icon theme dir holds (index.theme was missing on the first run)
          ls -la "$(brew --prefix)/share/icons/Adwaita" | head -20
          ls "$(brew --prefix)"/Cellar/adwaita-icon-theme/*/share/icons/Adwaita | head
          python3 .github/scripts/macos_bundle.py app \
            --binary target/release/patorrent-gtk \
            --prefix "$(brew --prefix)" \
            --icon-dir "$APP_ICON_DIR" \
            --app-id io.github.balls0fsteel.PaTorrent \
            --version "${{ needs.version.outputs.version }}" \
            --extra LICENSE.md --extra THIRD-PARTY-NOTICES.md \
            --minos-file macos-minos.txt \
            --out PaTorrent.app
          plutil -lint PaTorrent.app/Contents/Info.plist
          du -sh PaTorrent.app PaTorrent.app/Contents/*
      # nox links only the system (Secure Transport, D9): no Homebrew library may remain
      - name: nox's libraries
        run: python3 .github/scripts/macos_bundle.py check target/release/patorrent-nox target/x86_64-apple-darwin/release/patorrent-nox
      - name: Sign
        run: |
          xattr -cr PaTorrent.app
          codesign --force --deep --sign - PaTorrent.app
          codesign --verify --deep --strict --verbose=2 PaTorrent.app
          codesign --display --verbose=2 PaTorrent.app
      # Homebrew moved away (as on a Mac without it), so what starts uses the bundle only
      - name: Start without Homebrew
        run: |
          prefix="$(brew --prefix)"
          sudo mv "$prefix" "$prefix.away"
          trap 'sudo mv "$prefix.away" "$prefix"' EXIT
          PATORRENT_LAUNCHER_DEBUG=1 PaTorrent.app/Contents/MacOS/PaTorrent --version
          target/release/patorrent-nox --version
          arch -x86_64 target/x86_64-apple-darwin/release/patorrent-nox --version \
            || echo "::warning::the x86_64 nox did not run here (no Rosetta on the runner?)"
          # the GUI itself, with a fresh profile: it should still be running after 20 s
          export HOME="$RUNNER_TEMP/gui-home"
          mkdir -p "$HOME"
          PaTorrent.app/Contents/MacOS/PaTorrent > macos-gui.log 2>&1 &
          pid=$!
          sleep 20
          # (perl's alarm: screencapture must not hang on a permission prompt)
          perl -e 'alarm 20; exec @ARGV' screencapture -x macos-gui.png             || echo "::warning::screencapture failed"
          if kill -0 "$pid" 2>/dev/null; then
            echo "the GUI is running after 20 s"
            kill "$pid"
          else
            status=0
            wait "$pid" || status=$?
            echo "::warning::the GUI exited within 20 s (status $status); its output is below"
          fi
          echo "--- the GUI's output"
          cat macos-gui.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-gui-start
          path: |
            macos-gui.png
            macos-gui.log
          if-no-files-found: ignore
      - name: dmg and tarballs
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir dmg
          ditto PaTorrent.app dmg/PaTorrent.app
          ln -s /Applications dmg/Applications
          cp LICENSE.md THIRD-PARTY-NOTICES.md dmg/
          dmg="PaTorrent-$version-arm64.dmg"
          # hdiutil on the runners sometimes fails with "Resource busy": try again
          for i in 1 2 3 4 5; do
            hdiutil create -volname PaTorrent -srcfolder dmg -ov -format UDZO "$dmg" && break
            echo "::warning::hdiutil create failed (try $i)"
            sleep 10
          done
          test -f "$dmg"
          hdiutil verify "$dmg"
          # the app inside the image still verifies
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/PaTorrent.app"
          ls -la "$mnt"
          hdiutil detach "$mnt"

          for arch in arm64 x86_64; do
            name="patorrent-nox-$version-macos-$arch"
            if [ "$arch" = x86_64 ]; then
              bin=target/x86_64-apple-darwin/release/patorrent-nox
            else
              bin=target/release/patorrent-nox
            fi
            mkdir "$name"
            install -m 755 "$bin" "$name/"
            install -m 644 LICENSE.md THIRD-PARTY-NOTICES.md "$name/"
            tar -czf "$name.tar.gz" --uid 0 --gid 0 "$name"
          done
          ls -l *.dmg *.tar.gz
          echo "minimum macOS: $(cat macos-minos.txt)"
          echo "PaTorrent.app needs macOS $(cat macos-minos.txt) or later (arm64)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            PaTorrent-*.dmg
            patorrent-nox-*.tar.gz
      - name: Crash reports
        if: failure()
        run: python3 .github/scripts/macos_crash_reports.py

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, flatpak, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # the checkout is for docs/releases/<version>.md
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: files
      - run: cd files && sha256sum patorrent-* PaTorrent-* > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=(--draft --title "PaTorrent $VERSION")
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ -f "docs/releases/$VERSION.md" ]; then
            args+=(--notes-file "docs/releases/$VERSION.md")
          else
            args+=(--notes "Release notes: see CHANGELOG.md. Checksums: SHA256SUMS.")
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
            files/patorrent-* files/PaTorrent-* files/SHA256SUMS
