name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Note: never set RUSTFLAGS here; it would override the static-CRT flags in .cargo/config.toml.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  release-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Slow tests (release)
        run: cargo test --release -p libretorrent-core -- --ignored
      - name: Size, dependency and scale report
        shell: pwsh
        run: |
          $lines = @('## Release build (x86_64-pc-windows-msvc, static CRT)', '', '| Binary | Size |', '|---|---:|')
          foreach ($f in Get-ChildItem target/release/*.exe) { $lines += ('| {0} | {1:N0} KB |' -f $f.Name, ($f.Length / 1KB)) }
          $lines += @('', '## Linked crates (normal dependencies)', '', '```text')
          $lines += (cargo tree -e normal --workspace --prefix none --target x86_64-pc-windows-msvc | ForEach-Object { $_ -replace ' \(\*\)$', '' } | Where-Object { $_ } | Sort-Object -Unique)
          $lines += @('```', '', '## Scale benchmark (simulated engine)', '', '```text')
          $lines += (& ./target/release/lt-swarm.exe scale --torrents 10000 --seconds 3)
          $lines += @('```', '', '## Metadata parse benchmark (5,000 synthetic .torrent files)', '', '```text')
          & ./target/release/lt-swarm.exe gen --count 5000 --out corpus | Out-Null
          $lines += (& ./target/release/lt-swarm.exe parse corpus)
          $lines += '```'
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: libretorrent-windows-x64
          path: |
            target/release/libretorrent.exe
            target/release/libretorrent-nox.exe
            THIRD-PARTY-NOTICES.md
          retention-days: 14
