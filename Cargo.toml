[workspace]
members = ["crates/core", "crates/frontend", "crates/win32", "crates/nox", "crates/gtk", "tools/swarm"]
resolver = "3"

[workspace.package]
version = "1.1.4"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Balls0fSteel/PaTorrent"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
authors = ["DukeCorp1996"]

[workspace.dependencies]
patorrent-core = { path = "crates/core" }
patorrent-frontend = { path = "crates/frontend" }
patorrent-nox = { path = "crates/nox" }
windows-sys = "0.61"
mio = { version = "1.2", features = ["os-poll", "net"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Benchmarks and profiling: release speed with symbols.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
