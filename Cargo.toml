[workspace]
members = ["crates/core", "crates/frontend", "crates/win32", "crates/nox", "crates/gtk", "crates/cocoa", "tools/swarm"]
resolver = "3"

[workspace.package]
version = "1.2.21"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Balls0fSteel/Rookparcel"
publish = false
license = "PolyForm-Noncommercial-1.0.0"
authors = ["DukeCorp1996"]

[workspace.dependencies]
rookparcel-core = { path = "crates/core" }
rookparcel-frontend = { path = "crates/frontend" }
rookparcel-nox = { path = "crates/nox" }
windows-sys = "0.61"
mio = { version = "1.2", features = ["os-poll", "net"] }
# the native macOS GUI (crates/cocoa, D61): features are listed by the crate, defaults off
block2 = { version = "0.6.2", default-features = false }
objc2 = { version = "0.6.5", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false }
objc2-user-notifications = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Benchmarks and profiling: release speed with symbols.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
