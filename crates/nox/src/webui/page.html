<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PaTorrent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="login" hidden>
  <h1>PaTorrent</h1>
  <input name="username" placeholder="User name" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button>Log in</button>
  <p id="login-error"></p>
</form>
<div id="app" hidden>
  <div id="toolbar" role="toolbar">
    <button type="button" id="tb-menu" class="only-phone" title="Categories" aria-label="Categories" aria-expanded="false">&#9776;</button>
    <button type="button" id="tb-add" title="Add Torrent"><span class="only-desk">Add Torrent</span><span class="only-phone">Add</span></button>
    <button type="button" id="tb-add-url" class="only-desk" title="Add Torrent from URL">Add URL</button>
    <span class="sep only-desk"></span>
    <button type="button" id="tb-remove" data-cmd="remove" title="Remove">Remove</button>
    <span class="sep only-desk"></span>
    <button type="button" id="tb-start" data-cmd="start" title="Start">Start</button>
    <button type="button" id="tb-pause" data-cmd="pause" title="Pause">Pause</button>
    <button type="button" id="tb-stop" class="only-desk" data-cmd="stop" title="Stop">Stop</button>
    <span class="sep only-desk"></span>
    <button type="button" id="tb-up" class="only-desk" data-cmd="queue_up" title="Move Up Queue">Up</button>
    <button type="button" id="tb-down" class="only-desk" data-cmd="queue_down" title="Move Down Queue">Down</button>
    <span class="sep only-desk"></span>
    <button type="button" id="tb-prefs" class="only-desk" title="Preferences (Ctrl+P)">Preferences</button>
    <span class="grow"></span>
    <button type="button" id="tb-seldone" class="only-phone" title="End the selection" hidden>Done</button>
    <button type="button" id="tb-more" class="only-phone" title="More" aria-label="More">&#8943;</button>
    <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search torrents">
    <button type="button" id="logout" class="only-desk" title="Log out">Log out</button>
    <input id="file" type="file" accept=".torrent,application/x-bittorrent" multiple hidden>
  </div>
  <div id="main">
    <nav id="tree" aria-label="Categories"></nav>
    <div id="split-v" class="splitter v" role="separator" aria-orientation="vertical"></div>
    <div id="right">
      <div id="list">
        <div id="hdr" class="hdr"><div id="hdr-row" class="hrow"></div></div>
        <div id="body" class="body" tabindex="0" role="grid" aria-label="Torrents" aria-multiselectable="true">
          <div id="spacer"></div>
        </div>
      </div>
      <div id="split-h" class="splitter h" role="separator" aria-orientation="horizontal"></div>
      <div id="detail">
        <div id="sheet-head" class="only-phone">
          <span id="sheet-title"></span>
          <button type="button" id="sheet-close" title="Close" aria-label="Close details">&#10005;</button>
        </div>
        <div id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="general" class="on">General</button>
          <button type="button" role="tab" data-tab="trackers">Trackers</button>
          <button type="button" role="tab" data-tab="peers">Peers</button>
          <button type="button" role="tab" data-tab="pieces">Pieces</button>
          <button type="button" role="tab" data-tab="files">Files</button>
          <button type="button" role="tab" data-tab="speed">Speed</button>
          <button type="button" role="tab" data-tab="logger">Logger</button>
        </div>
        <div id="tab-body" role="tabpanel"></div>
      </div>
    </div>
  </div>
  <div id="statusbar">
    <span id="st-conn"></span>
    <span id="st-dht"></span>
    <span id="st-down"></span>
    <span id="st-up"></span>
    <span class="grow"></span>
    <span id="st-sel"></span>
  </div>
  <div id="scrim" hidden></div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="gate" hidden></div>
</div>
<dialog id="add" aria-labelledby="add-title">
  <form id="add-form">
    <h2 id="add-title">Add New Torrent</h2>
    <div class="add-cols">
      <div class="add-left">
        <fieldset>
          <legend>Save In</legend>
          <input id="add-save" list="add-dirs" autocomplete="off" aria-label="Save in">
          <datalist id="add-dirs"></datalist>
        </fieldset>
        <fieldset>
          <legend>Name</legend>
          <input id="add-name" autocomplete="off" aria-label="Name">
        </fieldset>
        <fieldset>
          <legend>Torrent Options</legend>
          <label><input type="checkbox" id="add-skip"> Skip hash check</label>
          <label><input type="checkbox" id="add-start" checked> Start torrent</label>
          <label><input type="checkbox" id="add-top"> Add to top of queue</label>
          <label class="lbl">Label: <input id="add-label" list="add-labels" autocomplete="off"></label>
          <datalist id="add-labels"></datalist>
        </fieldset>
      </div>
      <fieldset class="add-right">
        <legend>Torrent Contents</legend>
        <div class="add-info">
          <b>Name:</b><span id="add-t-name"></span>
          <b>Comment:</b><span id="add-t-comment"></span>
          <b>Size:</b><span id="add-t-size"></span>
          <b>Date:</b><span id="add-t-date"></span>
        </div>
        <div id="add-files" role="tree"></div>
        <div class="add-btns">
          <button type="button" id="add-all">Select All</button>
          <button type="button" id="add-none">Select None</button>
        </div>
      </fieldset>
    </div>
    <div class="add-ok">
      <button type="submit" id="add-ok">OK</button>
      <button type="button" id="add-cancel">Cancel</button>
    </div>
  </form>
</dialog>
<dialog id="prefs" aria-labelledby="prefs-title">
  <form id="prefs-form">
    <h2 id="prefs-title">Preferences</h2>
    <div class="prefs-cols">
      <nav id="prefs-tree" role="tree" aria-label="Preference pages"></nav>
      <div id="prefs-page"></div>
    </div>
    <div class="prefs-btns">
      <span id="prefs-msg" role="status"></span>
      <button type="submit" id="prefs-ok">OK</button>
      <button type="button" id="prefs-cancel">Cancel</button>
      <button type="button" id="prefs-apply">Apply</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
