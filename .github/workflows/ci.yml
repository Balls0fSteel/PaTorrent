name: CI

# The macos-debug branch: only the macOS job, with diagnostics (PLAN.md Next steps 0). Run with
# `gh workflow run CI --ref macos-debug`; never merged as is.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p patorrent-core --test external_ip --no-run
      # a_tracker_reply_sets_the_external_address timed out once with no alert at all
      - name: The external-address tests, 30 times
        run: |
          fails=0
          for i in $(seq 30); do
            echo "== run $i"
            cargo test -q -p patorrent-core --test external_ip || fails=$((fails + 1))
          done
          echo "failed runs: $fails of 30"
          test $fails -eq 0
      - name: Crash reports
        if: failure()
        run: python3 .github/scripts/macos_crash_reports.py
